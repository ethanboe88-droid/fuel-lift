<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1013">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fuel & Lift">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.png">
<title>Fuel &amp; Lift</title>
<style>
:root{--bg:#0e1013;--card:#171a1f;--card2:#1e2228;--line:#2a2f37;--txt:#eef1f5;--mut:#8b93a1;--acc:#3ddc84;--warn:#ffb020;--bad:#ff5c5c;--blue:#4da3ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(60px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-size:20px;margin:0}
.status{font-size:12px;color:var(--mut)}
.tabs{display:flex;gap:6px;background:var(--card);padding:4px;border-radius:12px;margin-bottom:14px}
.tabs button{flex:1;padding:10px;border:0;border-radius:9px;background:transparent;color:var(--mut);font-weight:600;font-size:15px}
.tabs button.on{background:var(--card2);color:var(--txt)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
.big{font-size:34px;font-weight:700;line-height:1}
.mut{color:var(--mut);font-size:13px}
.bar{height:12px;background:var(--card2);border-radius:99px;overflow:hidden;margin:12px 0 4px}
.bar.sm{height:7px;margin:8px 0 2px}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .3s}
input,textarea{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px;font-size:16px;width:100%;min-width:0;font-family:inherit}
textarea{resize:none;min-height:46px}
button{font-family:inherit;cursor:pointer}
.btn{background:var(--acc);color:#06210f;border:0;border-radius:10px;padding:11px 14px;font-weight:700;font-size:15px;white-space:nowrap}
.btn:disabled{opacity:.5}
.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px}
.icon{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;width:46px;height:46px;font-size:20px;flex:none}
.icon.rec{background:var(--bad);border-color:var(--bad)}
.x{background:none;border:0;color:var(--mut);font-size:18px;padding:4px 8px}
.item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line);gap:8px}
.hist{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.hd{background:var(--card2);border-radius:10px;padding:8px 2px;text-align:center;font-size:12px}
.hd b{display:block;font-size:13px;margin-top:3px}
.hd.sel{outline:1px solid var(--blue)}
.daynav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
details.day{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
details.day>summary{list-style:none;padding:14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
details.day.today{border-color:var(--blue)}
.dname{font-weight:700;font-size:16px}
.pill{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--card2);color:var(--mut)}
.pill.done{background:#163d27;color:var(--acc)}
.dbody{padding:0 14px 14px}
details.grp{background:var(--card2);border-radius:11px;margin-top:8px}
details.grp>summary{list-style:none;padding:11px 12px;display:flex;justify-content:space-between;font-weight:600;cursor:pointer}
.ex{border-top:1px solid var(--line);padding:10px 12px}
.exr{display:flex;align-items:center;gap:10px}
.exr input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc);flex:none}
.exr label{flex:1;display:flex;flex-direction:column}
.ex.chk .exn{color:var(--mut);text-decoration:line-through}
.last{font-size:12px;color:var(--blue)}
.lf{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px;margin-top:8px}
.lf input{padding:9px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{padding:7px 11px;border-radius:99px;border:1px solid var(--line);background:var(--card2);color:var(--mut);font-size:13px}
.chip.on{background:#14304f;border-color:var(--blue);color:var(--txt)}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);margin:16px 0 8px}
.ai{border-color:#2b4a6b}
.prev{margin-top:10px}
.prev .item b{white-space:nowrap}
.err{color:var(--bad);font-size:13px;margin-top:8px}
.recap{white-space:pre-wrap;margin-top:10px;line-height:1.5}
.login{max-width:340px;margin:20vh auto 0;text-align:center}
.thumb{width:46px;height:46px;border-radius:10px;object-fit:cover;flex:none}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="mut" style="text-align:center;margin-top:30vh">Loading…</p></div>
<script>
(function(){
var DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var S=null; // server state
var ui={tab:get('tab')||'cal',open:'',edit:false,calDay:'',logOpen:'',ai:null,aiBusy:false,aiErr:'',img:null,recap:'',recapBusy:false,status:''};
function get(k){try{return localStorage.getItem('fl_'+k)}catch(e){return null}}
function set(k,v){try{localStorage.setItem('fl_'+k,v)}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function iso(d){var m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd}
function today(){return iso(new Date())}
function parse(s){var p=s.split('-');return new Date(+p[0],p[1]-1,+p[2])}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function weekStart(s){var d=parse(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return iso(d)}
function dayKey(s){return DAYS[(parse(s).getDay()+6)%7]}
function fmt(n){return Math.round(n||0).toLocaleString()}
function short(s){return parse(s).toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function meals(day){return S.meals.filter(function(m){return m.day===day})}
function tot(day,f){return meals(day).reduce(function(a,b){return a+(+b[f]||0)},0)}
function checked(wk,k){return S.checks.some(function(c){return c.week===wk&&c.k===k})}
function lastLift(ex){for(var i=0;i<S.lifts.length;i++)if(S.lifts[i].exercise.toLowerCase()===ex.toLowerCase())return S.lifts[i];return null}
function liftStr(l){var s='';if(l.weight)s+=(+l.weight)+' lb';if(l.reps)s+=(s?' × ':'')+l.reps;if(l.sets)s+=' × '+l.sets;return s||'done'}
function allExercises(){var a=[];Object.keys(S.groups).forEach(function(g){S.groups[g].forEach(function(e){a.push(e)})});return a}

function api(path,opts){
  opts=opts||{};
  return fetch(path,{method:opts.method||(opts.body?'POST':'GET'),headers:opts.body?{'content-type':'application/json'}:{},body:opts.body?JSON.stringify(opts.body):undefined,credentials:'same-origin'})
  .then(function(r){return r.json().catch(function(){return{}}).then(function(d){
    if(r.status===401&&path!=='/api/login'){S=null;renderLogin();throw new Error('login')}
    if(!r.ok)throw new Error(d.error||('Error '+r.status));return d})});
}
function flash(t){ui.status=t;var el=document.getElementById('st');if(el)el.textContent=t;if(t==='Saved ✓')setTimeout(function(){if(ui.status===t){ui.status='';var e=document.getElementById('st');if(e)e.textContent=''}},1500)}
function saving(p){flash('Saving…');return p.then(function(x){flash('Saved ✓');return x}).catch(function(e){if(e.message!=='login')flash('⚠ '+e.message);throw e})}

function load(){return api('/api/state?today='+today()).then(function(d){S=d;render()}).catch(function(e){if(e.message!=='login')document.getElementById('app').innerHTML='<p class="err" style="text-align:center;margin-top:30vh">'+esc(e.message)+'</p>'})}

function renderLogin(err){
  document.getElementById('app').innerHTML='<form class="login card" id="login"><h1 style="margin-bottom:6px">Fuel &amp; Lift</h1><p class="mut">Enter your password</p><input type="password" name="pw" autocomplete="current-password" autofocus><button class="btn" style="width:100%;margin-top:10px">Log in</button>'+(err?'<div class="err">'+esc(err)+'</div>':'')+'</form>';
}

// ---------- render ----------
function render(){
  if(!S)return;
  var h='<header><h1>Fuel &amp; Lift</h1><span class="status" id="st">'+esc(ui.status)+'</span></header>';
  h+='<div class="tabs"><button data-tab="cal" class="'+(ui.tab==='cal'?'on':'')+'">Calories</button><button data-tab="wo" class="'+(ui.tab==='wo'?'on':'')+'">Workouts</button></div>';
  h+=renderAI();
  h+=ui.tab==='cal'?renderCal():renderWo();
  var a=document.getElementById('app'),ta=document.getElementById('aitext'),keep=ta?ta.value:'';
  a.innerHTML=h;
  var nt=document.getElementById('aitext');if(nt&&keep)nt.value=keep;
}

function renderAI(){
  var h='<div class="card ai"><div class="row" style="justify-content:space-between;margin-bottom:8px"><b>Quick log</b><span class="mut">food or lifts, any wording</span></div>';
  h+='<form id="aiform" class="row" style="align-items:flex-end">';
  if(ui.img)h+='<img class="thumb" src="'+ui.img+'" data-act="clearimg" title="Remove photo">';
  else h+='<label class="icon" style="display:flex;align-items:center;justify-content:center">📷<input type="file" accept="image/*" id="photo" style="display:none"></label>';
  h+='<textarea id="aitext" rows="1" placeholder="'+(ui.tab==='cal'?'e.g. Chipotle bowl double chicken':'e.g. bench 185x5x3, pulldown 140x10x3')+'"></textarea>';
  if(window.webkitSpeechRecognition||window.SpeechRecognition)h+='<button type="button" class="icon'+(rec?' rec':'')+'" data-act="mic">🎤</button>';
  h+='<button class="btn" '+(ui.aiBusy?'disabled':'')+'>'+(ui.aiBusy?'…':'Go')+'</button></form>';
  if(ui.aiErr)h+='<div class="err">'+esc(ui.aiErr)+'</div>';
  if(ui.ai){
    var r=ui.ai,n=(r.meals||[]).length+(r.lifts||[]).length;
    h+='<div class="prev">';
    if(!n)h+='<div class="mut">Nothing to log from that. Try rewording.</div>';
    (r.meals||[]).forEach(function(m,i){h+='<div class="item"><span>🍽 '+esc(m.name)+'</span><span class="row"><input class="sm" data-edit="m'+i+'" type="number" inputmode="numeric" value="'+(m.calories||0)+'" style="width:80px;padding:7px"><span class="mut">cal · '+(m.protein||0)+'g P</span><button class="x" data-rm="m'+i+'">×</button></span></div>'});
    (r.lifts||[]).forEach(function(l,i){h+='<div class="item"><span>🏋️ '+esc(l.exercise)+'</span><span class="row"><b>'+esc(liftStr(l))+'</b><button class="x" data-rm="l'+i+'">×</button></span></div>'});
    if(r.note)h+='<div class="mut" style="margin-top:6px">'+esc(r.note)+'</div>';
    if(n)h+='<div class="row" style="margin-top:10px"><button class="btn" data-act="aiok" style="flex:1">✓ Add '+(n>1?'all':'')+'</button><button class="ghost" data-act="aicancel">Cancel</button></div>';
    h+='</div>';
  }
  return h+'</div>';
}

function color(t,g){return !t?'var(--mut)':(!g?'var(--txt)':(t>g*1.05?'var(--bad)':(t>=g*0.9?'var(--acc)':'var(--warn)')))}

function renderCal(){
  var t=today(),day=ui.calDay||t,c=tot(day,'calories'),p=tot(day,'protein'),g=+S.goal||0,pg=+S.proteinGoal||0,left=g-c;
  var h='<div class="card"><div class="daynav"><button class="ghost" data-act="prev">‹</button><b>'+(day===t?'Today':parse(day).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}))+'</b><button class="ghost" data-act="next" '+(day>=t?'disabled style="opacity:.3"':'')+'>›</button></div>';
  h+='<div class="row" style="justify-content:space-between;align-items:flex-end"><div><div class="big">'+fmt(c)+'</div><div class="mut">calories</div></div>';
  h+='<div style="text-align:right">'+(g?'<div style="font-size:20px;font-weight:700;color:'+(left>=0?'var(--txt)':'var(--bad)')+'">'+(left>=0?fmt(left)+' left':fmt(-left)+' over')+'</div><div class="mut">goal '+fmt(g)+'</div>':'<div class="mut">Set a goal below</div>')+'</div></div>';
  h+='<div class="bar"><i style="width:'+(g?Math.min(100,c/g*100):0)+'%;background:'+(g?color(c,g):'var(--blue)')+'"></i></div>';
  h+='<div class="row" style="justify-content:space-between;margin-top:10px"><span class="mut">Protein</span><b>'+fmt(p)+'g'+(pg?' <span class="mut">/ '+fmt(pg)+'g</span>':'')+'</b></div>';
  if(pg)h+='<div class="bar sm"><i style="width:'+Math.min(100,p/pg*100)+'%;background:var(--blue)"></i></div>';
  h+='<form class="row" id="addmeal" style="margin-top:12px"><input name="n" placeholder="Food" style="flex:2"><input name="c" type="number" inputmode="numeric" placeholder="Cal" style="flex:1"><input name="p" type="number" inputmode="numeric" placeholder="P (g)" style="flex:1"><button class="btn">+</button></form>';
  var ms=meals(day);
  if(ms.length){h+='<div style="margin-top:10px">';ms.forEach(function(m){h+='<div class="item"><span>'+(esc(m.name)||'<span class="mut">Entry</span>')+'</span><span class="row"><b>'+fmt(m.calories)+'</b>'+(m.protein!=null?'<span class="mut">'+m.protein+'g</span>':'')+'<button class="x" data-delmeal="'+m.id+'">×</button></span></div>'});h+='</div>'}
  h+='</div>';
  // 7 days
  var sum=0,n=0,hit=0;h+='<div class="card"><b>Last 7 days</b><div class="hist">';
  for(var i=6;i>=0;i--){var d=addDays(t,-i),tt=tot(d,'calories');if(tt){sum+=tt;n++;if(g&&tt>=g*0.9&&tt<=g*1.05)hit++}
    h+='<div class="hd'+(d===day?' sel':'')+'" data-goday="'+d+'">'+dayKey(d)+'<b style="color:'+color(tt,g)+'">'+(tt?fmt(tt):'–')+'</b></div>'}
  h+='</div><div class="mut" style="margin-top:10px">Avg: <b style="color:var(--txt)">'+(n?fmt(sum/n):'–')+'</b>'+(g?' · On target: <b style="color:var(--txt)">'+hit+'/7</b>':'')+'</div></div>';
  // recap
  h+='<div class="card"><div class="row" style="justify-content:space-between"><b>Weekly check-in</b><button class="ghost" data-act="recap" '+(ui.recapBusy?'disabled':'')+'>'+(ui.recapBusy?'Thinking…':'Run it')+'</button></div>'+(ui.recap?'<div class="recap">'+esc(ui.recap)+'</div>':'<div class="mut" style="margin-top:6px">AI reads your last 7 days and tells you what to fix.</div>')+'</div>';
  // goals
  h+='<div class="card"><b>Daily goals</b><form class="row" id="goals" style="margin-top:10px"><input name="g" type="number" inputmode="numeric" placeholder="Calories" value="'+(g||'')+'"><input name="pg" type="number" inputmode="numeric" placeholder="Protein (g)" value="'+(pg||'')+'"><button class="btn">Save</button></form></div>';
  h+='<div style="text-align:center"><button class="ghost" data-act="logout" style="margin-top:6px">Log out</button></div>';
  return h;
}

function renderWo(){
  var t=today(),wk=weekStart(t),tk=dayKey(t);
  var h='<div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="mut">Week of '+short(wk)+' · checks reset Monday</span><button class="ghost" data-act="edit">'+(ui.edit?'Done':'Edit plan')+'</button></div>';
  if(ui.edit)return h+renderEdit();
  DAYS.forEach(function(d){
    var gs=S.plan[d]||[],all=0,done=0;
    gs.forEach(function(g){(S.groups[g]||[]).forEach(function(e){all++;if(checked(wk,d+'|'+g+'|'+e))done++})});
    var open=ui.open?ui.open===d:d===tk;
    h+='<details class="day'+(d===tk?' today':'')+'" data-day="'+d+'"'+(open?' open':'')+'><summary><div><div class="dname">'+d+(d===tk?' <span class="mut">· today</span>':'')+'</div><div class="mut">'+(gs.length?esc(gs.join(' + ')):'Rest')+'</div></div>';
    h+=gs.length?'<span class="pill'+(all&&done===all?' done':'')+'">'+done+'/'+all+'</span>':'<span class="pill">Rest</span>';
    h+='</summary><div class="dbody">';
    if(!gs.length)h+='<div class="mut">Rest day. Tap "Edit plan" to add muscle groups.</div>';
    gs.forEach(function(g){
      var ex=S.groups[g]||[],dn=ex.filter(function(e){return checked(wk,d+'|'+g+'|'+e)}).length;
      h+='<details class="grp" open><summary><span>'+esc(g)+'</span><span class="mut">'+dn+'/'+ex.length+' ▾</span></summary>';
      ex.forEach(function(e){
        var k=d+'|'+g+'|'+e,on=checked(wk,k),l=lastLift(e),lk='lf:'+k;
        h+='<div class="ex'+(on?' chk':'')+'"><div class="exr"><input type="checkbox" data-chk="'+esc(k)+'"'+(on?' checked':'')+'><label><span class="exn">'+esc(e)+'</span>'+(l?'<span class="last">Last: '+esc(liftStr(l))+' · '+short(l.day)+'</span>':'')+'</label><button class="ghost" data-logopen="'+esc(lk)+'" style="padding:6px 10px">'+(ui.logOpen===lk?'×':'+ log')+'</button></div>';
        if(ui.logOpen===lk)h+='<form class="lf" data-liftform="'+esc(k)+'"><input name="w" type="number" inputmode="decimal" placeholder="lbs" value="'+(l&&l.weight||'')+'"><input name="r" type="number" inputmode="numeric" placeholder="reps" value="'+(l&&l.reps||'')+'"><input name="s" type="number" inputmode="numeric" placeholder="sets" value="'+(l&&l.sets||'')+'"><button class="btn">✓</button></form>';
        h+='</div>'});
      h+='</details>'});
    h+='</div></details>';
  });
  return h;
}

function renderEdit(){
  var names=Object.keys(S.groups),h='<div class="sec">Muscle groups per day</div>';
  DAYS.forEach(function(d){
    h+='<div class="card"><b>'+d+'</b><div class="chips">';
    names.forEach(function(g){h+='<button class="chip'+((S.plan[d]||[]).indexOf(g)>-1?' on':'')+'" data-tog="'+d+'" data-g="'+esc(g)+'">'+esc(g)+'</button>'});
    h+='</div></div>'});
  h+='<div class="sec">Exercises per muscle group</div>';
  names.forEach(function(g){
    h+='<details class="day"><summary><span class="dname">'+esc(g)+'</span><span class="mut">'+S.groups[g].length+' exercises ▾</span></summary><div class="dbody">';
    S.groups[g].forEach(function(e,i){h+='<div class="item"><span>'+esc(e)+'</span><button class="x" data-rmx="'+esc(g)+'" data-i="'+i+'">×</button></div>'});
    h+='<form class="row" data-addx="'+esc(g)+'" style="margin-top:8px"><input name="e" placeholder="Add exercise"><button class="btn">Add</button></form>';
    h+='<button class="ghost" style="margin-top:10px;color:var(--bad)" data-rmg="'+esc(g)+'">Delete '+esc(g)+'</button></div></details>'});
  h+='<div class="card"><b>New muscle group</b><form class="row" id="addg" style="margin-top:10px"><input name="g" placeholder="e.g. Forearms"><button class="btn">Add</button></form></div>';
  return h;
}

// ---------- actions ----------
function saveSettings(){return saving(api('/api/settings',{body:{groups:S.groups,plan:S.plan}}))}
function setCheck(k,on){
  var wk=weekStart(today());
  S.checks=S.checks.filter(function(c){return!(c.week===wk&&c.k===k)});
  if(on)S.checks.push({week:wk,k:k});
  return saving(api('/api/check',{body:{week:wk,k:k,on:on}}));
}
function addLift(l,checkKey){
  var b={day:today(),exercise:l.exercise,weight:l.weight,reps:l.reps,sets:l.sets};
  return saving(api('/api/lifts',{body:b})).then(function(r){b.id=r.id;S.lifts.unshift(b);
    // tick the matching exercise in today's plan
    var t=today(),d=dayKey(t),wk=weekStart(t),k=checkKey;
    if(!k)(S.plan[d]||[]).forEach(function(g){(S.groups[g]||[]).forEach(function(e){if(!k&&e.toLowerCase()===String(l.exercise).toLowerCase())k=d+'|'+g+'|'+e})});
    if(k&&k.split('|')[0]===d&&!checked(wk,k))return setCheck(k,true);
  });
}
function addMeal(m,day){
  var b={day:day||today(),name:m.name||'',calories:Math.round(+m.calories||0),protein:m.protein===''||m.protein==null?null:Math.round(+m.protein)};
  return saving(api('/api/meals',{body:b})).then(function(r){b.id=r.id;S.meals.push(b)});
}
function shrink(file){
  return new Promise(function(res,rej){
    var img=new Image(),u=URL.createObjectURL(file);
    img.onload=function(){var max=1024,s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.8))};
    img.onerror=function(){rej(new Error('Could not read that photo'))};img.src=u;
  });
}
var rec=null;
function toggleMic(){
  if(rec){rec.stop();return}
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;rec=new SR();rec.lang='en-US';rec.interimResults=true;
  var base=(document.getElementById('aitext')||{}).value||'';
  rec.onresult=function(e){var s='';for(var i=0;i<e.results.length;i++)s+=e.results[i][0].transcript;var ta=document.getElementById('aitext');if(ta)ta.value=(base?base+' ':'')+s};
  rec.onend=function(){rec=null;render()};rec.onerror=function(){rec=null;render()};
  rec.start();render();
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-tab],[data-act],[data-delmeal],[data-goday],[data-tog],[data-rmx],[data-rmg],[data-logopen],[data-rm]');if(!b||!S)return;
  var t=today(),a=b.dataset.act;
  if(b.dataset.tab){ui.tab=b.dataset.tab;set('tab',ui.tab);ui.ai=null;ui.aiErr='';render();return}
  if(a==='prev'){ui.calDay=addDays(ui.calDay||t,-1);render();return}
  if(a==='next'){var n=addDays(ui.calDay||t,1);ui.calDay=n>=t?'':n;render();return}
  if(a==='edit'){ui.edit=!ui.edit;render();return}
  if(a==='logout'){api('/api/logout',{body:{}}).then(function(){S=null;renderLogin()});return}
  if(a==='clearimg'){ui.img=null;render();return}
  if(a==='mic'){toggleMic();return}
  if(a==='aicancel'){ui.ai=null;render();return}
  if(a==='aiok'){
    var r=ui.ai,day=ui.tab==='cal'?(ui.calDay||t):t;ui.ai=null;ui.img=null;var ta=document.getElementById('aitext');if(ta)ta.value='';
    var p=Promise.resolve();
    (r.meals||[]).forEach(function(m){p=p.then(function(){return addMeal(m,day)})});
    (r.lifts||[]).forEach(function(l){p=p.then(function(){return addLift(l)})});
    p.then(render,render);render();return}
  if(a==='recap'){runRecap();return}
  if(b.dataset.rm){var w=b.dataset.rm;ui.ai[w[0]==='m'?'meals':'lifts'].splice(+w.slice(1),1);render();return}
  if(b.dataset.goday){ui.calDay=b.dataset.goday===t?'':b.dataset.goday;render();return}
  if(b.dataset.delmeal){var id=+b.dataset.delmeal;S.meals=S.meals.filter(function(m){return m.id!==id});render();saving(api('/api/meals/'+id,{method:'DELETE'}));return}
  if(b.dataset.logopen){ui.logOpen=ui.logOpen===b.dataset.logopen?'':b.dataset.logopen;render();return}
  if(b.dataset.tog){var d=b.dataset.tog,g=b.dataset.g,arr=S.plan[d]=S.plan[d]||[],i=arr.indexOf(g);if(i>-1)arr.splice(i,1);else arr.push(g);render();saveSettings();return}
  if(b.dataset.rmx){S.groups[b.dataset.rmx].splice(+b.dataset.i,1);render();saveSettings();return}
  if(b.dataset.rmg){var gg=b.dataset.rmg;delete S.groups[gg];DAYS.forEach(function(d){S.plan[d]=(S.plan[d]||[]).filter(function(x){return x!==gg})});render();saveSettings();return}
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='photo'&&el.files&&el.files[0]){shrink(el.files[0]).then(function(u){ui.img=u;render()}).catch(function(er){ui.aiErr=er.message;render()});return}
  if(el.dataset&&el.dataset.edit&&ui.ai){var w=el.dataset.edit;ui.ai.meals[+w.slice(1)].calories=Math.round(+el.value||0);return}
  var k=el.dataset&&el.dataset.chk;if(!k)return;
  ui.open=k.split('|')[0];setCheck(k,el.checked);render();
});
document.addEventListener('toggle',function(e){var d=e.target.dataset&&e.target.dataset.day;if(d&&!ui.edit&&e.target.open)ui.open=d},true);
document.addEventListener('submit',function(e){
  e.preventDefault();var f=e.target,v=function(n){return f.elements[n]?f.elements[n].value.trim():''};
  if(f.id==='login'){api('/api/login',{body:{password:v('pw')}}).then(load).catch(function(er){renderLogin(er.message)});return}
  if(!S)return;
  if(f.id==='aiform'){runAI();return}
  if(f.id==='addmeal'){var c=parseFloat(v('c'));if(!(c>=0))return;addMeal({name:v('n'),calories:c,protein:v('p')},ui.calDay||today()).then(render);return}
  if(f.id==='goals'){S.goal=Math.max(0,Math.round(+v('g')||0));S.proteinGoal=Math.max(0,Math.round(+v('pg')||0));saving(api('/api/settings',{body:{goal:S.goal,proteinGoal:S.proteinGoal}}));render();return}
  if(f.dataset.liftform){var k=f.dataset.liftform;ui.logOpen='';addLift({exercise:k.split('|')[2],weight:v('w'),reps:v('r'),sets:v('s')},k).then(render,render);render();return}
  if(f.dataset.addx){var x=v('e'),g=f.dataset.addx;if(x&&S.groups[g].indexOf(x)<0){S.groups[g].push(x);render();saveSettings()}return}
  if(f.id==='addg'){var ng=v('g');if(ng&&!S.groups[ng]){S.groups[ng]=[];render();saveSettings()}return}
});
document.addEventListener('keydown',function(e){if(e.target.id==='aitext'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();runAI()}});

function runAI(){
  var ta=document.getElementById('aitext'),text=ta?ta.value.trim():'';
  if(!text&&!ui.img)return;if(ui.aiBusy)return;
  ui.aiBusy=true;ui.aiErr='';ui.ai=null;render();
  api('/api/ai/parse',{body:{text:text,image:ui.img,exercises:allExercises()}})
  .then(function(r){ui.ai={meals:r.meals||[],lifts:r.lifts||[],note:r.note||''}})
  .catch(function(e){if(e.message!=='login')ui.aiErr=e.message})
  .then(function(){ui.aiBusy=false;render()});
}
function runRecap(){
  var t=today(),days=[];
  for(var i=6;i>=0;i--){var d=addDays(t,-i);days.push({day:d,weekday:dayKey(d),calories:tot(d,'calories'),protein:tot(d,'protein'),logged:meals(d).length>0})}
  var wk=weekStart(t),planned=[],doneCt=0,all=0;
  DAYS.forEach(function(d){var gs=S.plan[d]||[];if(gs.length){var a=0,dn=0;gs.forEach(function(g){(S.groups[g]||[]).forEach(function(e){a++;if(checked(wk,d+'|'+g+'|'+e))dn++})});planned.push({day:d,groups:gs,exercisesDone:dn,exercisesPlanned:a});all+=a;doneCt+=dn}});
  var since=addDays(t,-28),lifts=S.lifts.filter(function(l){return l.day>=since});
  var summary={today:t,calorieGoal:S.goal||null,proteinGoal:S.proteinGoal||null,last7Days:days,thisWeekPlan:planned,note:'Week runs Mon-Sun; days after today have not happened yet',liftsLast4Weeks:lifts};
  ui.recapBusy=true;render();
  api('/api/ai/recap',{body:{summary:summary}}).then(function(r){ui.recap=r.text}).catch(function(e){if(e.message!=='login')ui.recap='⚠ '+e.message}).then(function(){ui.recapBusy=false;render()});
}

load();
})();
</script>
</body>
